<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>한식뷔페 다시갈지도</title>
  <style>
    :root {
      --pickle-surface-page: #F4F6F9;
      --pickle-surface-card: #FFFFFF;
      --pickle-surface-fill-faint: #EBF0F5;
      --pickle-surface-fill-soft: #DFE6ED;
      --pickle-text-primary: #191F28;
      --pickle-text-secondary: #4E5968;
      --pickle-text-tertiary: #8B95A1;
      --pickle-border-hairline: #E5E8EB;
      --pickle-radius-card: 14px;
      --pickle-radius-pill: 999px;
      --pickle-accent-primary: #E03E3E;
      --pickle-accent-green: #0E8A16;
      --pickle-accent-blue: #1E64D4;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: var(--pickle-surface-page);
      color: var(--pickle-text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "맑은 고딕", sans-serif;
      line-height: 1.45;
      padding-bottom: 70px;
    }
    .app-container {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--pickle-surface-page);
    }
    
    /* Top Bar */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--pickle-border-hairline);
      padding: 10px 14px;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-icon {
      font-size: 22px;
    }
    .brand-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--pickle-text-primary);
    }
    .brand-badge {
      font-size: 11px;
      background: #FFEAEA;
      color: #E03E3E;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: var(--pickle-radius-pill);
    }
    .header-actions {
      display: flex;
      gap: 5px;
    }
    .action-btn {
      border: 1px solid var(--pickle-border-hairline);
      background: #fff;
      color: var(--pickle-text-primary);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 9px;
      border-radius: var(--pickle-radius-pill);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      transition: all 0.2s;
    }
    .action-btn.active {
      background: #FFEAEA;
      border-color: #E03E3E;
      color: #E03E3E;
    }

    /* Search Box */
    .search-box {
      position: relative;
    }
    .search-input {
      width: 100%;
      height: 38px;
      background: var(--pickle-surface-fill-faint);
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 0 12px 0 34px;
      font-size: 13px;
      color: var(--pickle-text-primary);
      outline: none;
      transition: all 0.2s;
    }
    .search-input:focus {
      background: #fff;
      border-color: #3182F6;
      box-shadow: 0 0 0 2px rgba(49, 130, 246, 0.15);
    }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: var(--pickle-text-tertiary);
    }
    .clear-search {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--pickle-text-tertiary);
      color: #fff;
      border: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      font-size: 10px;
      cursor: pointer;
      display: none;
    }

    /* Date & Realtime Live Status Banner */
    .today-live-bar {
      padding: 7px 14px;
      background: #191F28;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
    }
    .today-date-text {
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .live-time-indicator {
      color: #A6AFB8;
      font-size: 11px;
    }

    /* Map Section */
    .map-toggle-bar {
      padding: 7px 14px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--pickle-border-hairline);
    }
    .map-toggle-btn {
      background: none;
      border: none;
      font-size: 12px;
      font-weight: 700;
      color: #1E64D4;
      display: flex;
      align-items: center;
      gap: 3px;
      cursor: pointer;
    }
    .interactive-map-box {
      background: #FFFFFF;
      padding: 10px 14px;
      border-bottom: 1px solid var(--pickle-border-hairline);
      display: block;
    }
    .map-svg-container {
      background: #EEF2F6;
      border-radius: 10px;
      padding: 10px;
      border: 1px solid var(--pickle-border-hairline);
    }
    .map-cluster-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--pickle-text-secondary);
      margin-bottom: 5px;
      display: flex;
      justify-content: space-between;
    }
    .cluster-pins {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .cluster-pin {
      background: #fff;
      border: 1px solid #D0D7DE;
      padding: 3px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .cluster-pin:hover, .cluster-pin.active {
      background: #E8F3FF;
      border-color: #3182F6;
      color: #1E64D4;
    }

    /* Filter Bar */
    .filter-section {
      padding: 8px 14px;
      background: #fff;
      border-bottom: 1px solid var(--pickle-border-hairline);
    }
    .region-tabs {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
      margin-bottom: 6px;
    }
    .region-tabs::-webkit-scrollbar { display: none; }
    .region-tab {
      flex-shrink: 0;
      padding: 5px 10px;
      border-radius: var(--pickle-radius-pill);
      font-size: 12px;
      font-weight: 600;
      background: var(--pickle-surface-fill-faint);
      color: var(--pickle-text-secondary);
      border: none;
      cursor: pointer;
    }
    .region-tab.active {
      background: var(--pickle-text-primary);
      color: #fff;
    }

    .tag-chips {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tag-chips::-webkit-scrollbar { display: none; }
    .tag-chip {
      flex-shrink: 0;
      padding: 3px 8px;
      border-radius: var(--pickle-radius-pill);
      font-size: 11px;
      background: #fff;
      border: 1px solid var(--pickle-border-hairline);
      color: var(--pickle-text-secondary);
      cursor: pointer;
    }
    .tag-chip.active {
      background: #E8F3FF;
      border-color: #3182F6;
      color: #1E64D4;
      font-weight: 700;
    }

    /* Stats Bar */
    .stats-bar {
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--pickle-text-secondary);
    }
    .savings-badge {
      background: #EAF8E8;
      color: var(--pickle-accent-green);
      font-weight: 700;
      padding: 2px 7px;
      border-radius: var(--pickle-radius-pill);
    }

    /* Card List (Compact & Fast) */
    .card-list {
      padding: 0 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .buffet-card {
      background: var(--pickle-surface-card);
      border-radius: var(--pickle-radius-card);
      border: 1px solid var(--pickle-border-hairline);
      padding: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.02);
    }

    /* Live Open/Closed Status Badges */
    .status-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }
    .status-open { background: #EAF8E8; color: #0E8A16; }
    .status-break { background: #FFF4E5; color: #D9730D; }
    .status-closed { background: #FFF1F0; color: #E03E3E; }

    .card-top-badges {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .badge-gasan { background: #E8F3FF; color: #1E64D4; }
    .badge-guro { background: #FFF4E5; color: #D9730D; }
    .badge-gwang { background: #EAF8E8; color: #0E8A16; }
    .badge-price { background: #FFEAEA; color: #E03E3E; margin-left: auto; font-size: 13px; font-weight: 800; }

    .card-title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--pickle-text-primary);
    }
    .fav-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #D1D6DB;
      padding: 0 4px;
    }
    .fav-btn.active {
      color: #FFB300;
    }

    .meta-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--pickle-text-secondary);
      margin-bottom: 8px;
    }
    .meta-item {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    /* Compact Today Menu Box with Real vs Sample Badge */
    .menu-compact-box {
      background: #FFFDF5;
      border: 1px solid #FDE68A;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
      font-size: 12px;
      line-height: 1.4;
    }
    .menu-compact-box.real-menu-box {
      background: #F0FDF4;
      border-color: #BBF7D0;
    }
    .menu-compact-header {
      font-weight: 800;
      font-size: 11px;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge-real-label {
      background: #DCFCE7;
      color: #15803D;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
    }
    .badge-sample-label {
      background: #FEF3C7;
      color: #B45309;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
    }

    .menu-compact-main {
      color: #191F28;
      font-weight: 700;
    }
    .menu-compact-sub {
      color: #4E5968;
      font-size: 11px;
      margin-top: 2px;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 10px;
    }
    .tag {
      font-size: 11px;
      background: #F2F4F6;
      color: #4E5968;
      padding: 1px 5px;
      border-radius: 4px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px dashed var(--pickle-border-hairline);
      padding-top: 8px;
    }
    .revisit-vote {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .revisit-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--pickle-text-tertiary);
    }
    .vote-btn {
      border: 1px solid var(--pickle-border-hairline);
      background: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 6px;
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 2px;
      color: var(--pickle-text-secondary);
    }
    .vote-btn.voted-up {
      background: #EAF8E8;
      border-color: #0E8A16;
      color: #0E8A16;
      font-weight: 700;
    }
    .vote-btn.voted-down {
      background: #FFF1F0;
      border-color: #E03E3E;
      color: #E03E3E;
    }

    .card-btn-group {
      display: flex;
      gap: 5px;
    }
    .map-link-btn {
      font-size: 11px;
      color: #0E8A16;
      background: #EAF8E8;
      border: none;
      padding: 4px 7px;
      border-radius: 5px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    .menu-info-btn {
      font-size: 11px;
      color: #1E64D4;
      background: #E8F3FF;
      border: none;
      padding: 4px 8px;
      border-radius: 5px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--pickle-text-tertiary);
    }
    .empty-icon { font-size: 40px; margin-bottom: 8px; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal {
      background: #fff;
      width: 100%;
      max-width: 420px;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      animation: modalUp 0.2s ease-out;
      max-height: 90vh;
      overflow-y: auto;
    }
    @keyframes modalUp {
      from { transform: translateY(15px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .modal-title {
      font-size: 17px;
      font-weight: 800;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 20px;
      color: var(--pickle-text-tertiary);
      cursor: pointer;
    }
    .modal-body {
      font-size: 13px;
      color: var(--pickle-text-secondary);
      line-height: 1.5;
    }
    .modal-roulette-box {
      background: #F8F9FA;
      border: 2px dashed #E5E8EB;
      border-radius: 12px;
      padding: 20px 14px;
      text-align: center;
      margin: 14px 0;
    }
    .roulette-result-name {
      font-size: 19px;
      font-weight: 800;
      color: #E03E3E;
      margin-bottom: 3px;
    }
    .roulette-result-sub {
      font-size: 12px;
      color: #4E5968;
    }
    .spin-btn {
      width: 100%;
      height: 44px;
      background: #E03E3E;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <div class="header-top">
        <div class="brand">
          <span class="brand-icon">🍱</span>
          <div>
            <span class="brand-title">한식뷔페 다시갈지도</span>
            <span class="brand-badge">식단 상태 투명 표기</span>
          </div>
        </div>
        <div class="header-actions">
          <button class="action-btn" id="rouletteBtn">🎲 점심 룰렛</button>
          <button class="action-btn" id="favFilterBtn">⭐ 찜 <span id="favCount">0</span></button>
        </div>
      </div>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="searchInput" placeholder="식당명, 빌딩명, 라면, 제육 등 검색...">
        <button class="clear-search" id="clearSearchBtn">✕</button>
      </div>
    </header>

    <!-- Date & Realtime Live Status Banner -->
    <div class="today-live-bar">
      <div class="today-date-text">
        <span>📅</span>
        <span id="currentDateStr">2026년 11월 12일 (목)</span>
      </div>
      <div class="live-time-indicator" id="liveTimeIndicator">실시간 영업현황 반영중</div>
    </div>

    <!-- Visual Interactive Area Map -->
    <div class="map-toggle-bar">
      <div style="font-size:12px; font-weight:700; color:#4E5968;">🗺️ 거점 블록 바로가기</div>
      <button class="map-toggle-btn" id="toggleMapBtn">지도 접기 ▴</button>
    </div>
    <div class="interactive-map-box" id="mapBox">
      <div class="map-svg-container">
        <div class="map-cluster-title">
          <span>🚇 지하철역 & 주요 지산 블록</span>
          <span style="font-size:10px; color:#8B95A1;">터치 시 해당 구역 필터링</span>
        </div>
        <div class="cluster-pins">
          <button class="cluster-pin" onclick="filterByCluster('가산', '에이스')">📍 가디역·에이스타운 (7곳)</button>
          <button class="cluster-pin" onclick="filterByCluster('가산', '대륭')">📍 가산·대륭타운 (4곳)</button>
          <button class="cluster-pin" onclick="filterByCluster('가산', '어반워크')">📍 가산·어반워크/현대 (3곳)</button>
          <button class="cluster-pin" onclick="filterByCluster('구로', '대륭포스트')">📍 구디역·대륭포스트 (4곳)</button>
          <button class="cluster-pin" onclick="filterByCluster('구로', '코오롱')">📍 구디·코오롱밸리 (2곳)</button>
          <button class="cluster-pin" onclick="filterByCluster('구로', '에이스')">📍 구디·에이스테크노 (3곳)</button>
          <button class="cluster-pin" onclick="filterByCluster('광명', 'GIDC')">📍 광명역·GIDC단지 (4곳)</button>
          <button class="cluster-pin" onclick="filterByCluster('광명', '소하')">📍 광명·소하/하안지산 (4곳)</button>
          <button class="cluster-pin" onclick="filterByCluster('광명', 'M클러스터')">📍 광명·M클러스터/자이 (2곳)</button>
        </div>
      </div>
    </div>

    <div class="filter-section">
      <div class="region-tabs" id="regionTabs">
        <button class="region-tab active" data-region="전체">전체 (52)</button>
        <button class="region-tab" data-region="가산디지털단지">가산 (24)</button>
        <button class="region-tab" data-region="구로디지털단지">구로 (16)</button>
        <button class="region-tab" data-region="광명시">광명 (12)</button>
      </div>
      <div class="tag-chips" id="tagChips">
        <button class="tag-chip" data-tag="라면기계">🍜 한강라면</button>
        <button class="tag-chip" data-tag="탄산음료">🥤 탄산음료</button>
        <button class="tag-chip" data-tag="계란후라이">🍳 계란후라이</button>
        <button class="tag-chip" data-tag="고기특식">🍖 고기특식</button>
        <button class="tag-chip" data-tag="지상층">🏢 지상층</button>
        <button class="tag-chip" data-tag="디저트후식">🍧 후식/디저트</button>
      </div>
    </div>

    <div class="stats-bar">
      <div>검색 결과 <strong id="matchCount">52</strong>곳 (실제 식단 14곳 · 샘플 38곳)</div>
      <div class="savings-badge">💰 한 끼 4,420원 절약!</div>
    </div>

    <div class="card-list" id="cardList"></div>
  </div>

  <!-- Roulette Modal -->
  <div class="modal-overlay" id="rouletteModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">🎲 오늘 점심 뭐 먹지?</div>
        <button class="close-btn" onclick="closeRouletteModal()">✕</button>
      </div>
      <div class="modal-body">
        현재 선택된 지역(<strong id="rouletteRegionName">전체</strong>)에서 딱 하나 골라드립니다!
        <div class="modal-roulette-box" id="rouletteBox">
          <div class="roulette-result-name" id="rouletteName">룰렛을 돌려보세요!</div>
          <div class="roulette-result-sub" id="rouletteSub">7,000~8,000원대 알짜 식당 추천</div>
        </div>
        <button class="spin-btn" id="spinActionBtn" onclick="runSpin()">룰렛 돌리기 🎯</button>
      </div>
    </div>
  </div>

  <!-- Info Modal -->
  <div class="modal-overlay" id="infoModal">

        <div style="margin-bottom:12px; font-size:12px; background:#F8F9FA; padding:10px; border-radius:8px;">
          <strong>⏰ 이용시간:</strong> ${p.hours}<br>
          <strong>🚫 휴무 안내:</strong> ${p.closed_rule}<br>
          <strong>🏢 상세 위치:</strong> ${p.building}<br>
          <strong>📍 도로명:</strong> ${p.address}<br>
          <strong>💵 식사 가격:</strong> ${p.price.toLocaleString()}원
        </div>

        <div style="background:#F2F4F6; padding:10px; border-radius:8px; margin-bottom:12px; font-size:12px;">
          <strong>📢 당일 식단 공지:</strong> ${p.channel} (오전 10:30~11:00 업로드)
        </div>

        <div style="font-size:12px; color:#E03E3E; font-weight:700; margin-bottom:12px;">
          💡 꿀팁: ${p.note}
        </div>

        <div style="display:flex; flex-direction:column; gap:6px;">
          <a href="${p.naver_map}" target="_blank" style="text-align:center; background:#0E8A16; color:#fff; padding:9px; border-radius:7px; text-decoration:none; font-weight:700; font-size:12px;">네이버 지도 '${p.map_query}' 검색 🧭</a>
          <a href="${p.naver_addr_map}" target="_blank" style="text-align:center; background:#1E64D4; color:#fff; padding:9px; border-radius:7px; text-decoration:none; font-weight:700; font-size:12px;">건물 도로명 주소로 길찾기 📍</a>
          <a href="${p.kakao_map}" target="_blank" style="text-align:center; background:#FEE500; color:#191F28; padding:9px; border-radius:7px; text-decoration:none; font-weight:700; font-size:12px;">카카오맵 길찾기 🗺️</a>
        </div>
      `;
      document.getElementById("infoModal").style.display = "flex";
      state.metrics.views_count++;
      saveState();
    }

    function closeInfoModal() {
      document.getElementById("infoModal").style.display = "none";
    }

    function openRouletteModal() {
      document.getElementById("rouletteRegionName").innerText = state.selectedRegion;
      document.getElementById("rouletteModal").style.display = "flex";
    }
    function closeRouletteModal() {
      document.getElementById("rouletteModal").style.display = "none";
    }

    function runSpin() {
      const candidates = getFilteredPlaces();
      if (candidates.length === 0) return;

      const btn = document.getElementById("spinActionBtn");
      btn.disabled = true;
      btn.innerText = "추첨 중... 🥁";

      let count = 0;
      const interval = setInterval(() => {
        const rand = candidates[Math.floor(Math.random() * candidates.length)];
        document.getElementById("rouletteName").innerText = rand.name;
        document.getElementById("rouletteSub").innerText = `${rand.building} (${rand.price.toLocaleString()}원)`;
        count++;
        if (count > 15) {
          clearInterval(interval);
          const winner = candidates[Math.floor(Math.random() * candidates.length)];
          document.getElementById("rouletteName").innerText = "🎉 " + winner.name;
          document.getElementById("rouletteSub").innerText = `${winner.building} | ${winner.price.toLocaleString()}원 | ${winner.note}`;
          btn.disabled = false;
          btn.innerText = "다시 돌리기 🎯";
          sendSignal(`오늘 점심 룰렛 결과로 '${winner.name}'(${winner.region})이 추천되었습니다.`);
        }
      }, 80);
    }

    document.getElementById("regionTabs").addEventListener("click", (e) => {
      if (e.target.classList.contains("region-tab")) {
        state.selectedRegion = e.target.dataset.region;
        renderApp();
        saveState();
      }
    });

    document.getElementById("tagChips").addEventListener("click", (e) => {
      if (e.target.classList.contains("tag-chip")) {
        const tag = e.target.dataset.tag;
        state.selectedTag = state.selectedTag === tag ? null : tag;
        renderApp();
        saveState();
      }
    });

    document.getElementById("favFilterBtn").addEventListener("click", () => {
      state.onlyFavorites = !state.onlyFavorites;
      renderApp();
      saveState();
    });

    document.getElementById("rouletteBtn").addEventListener("click", openRouletteModal);

    const searchInput = document.getElementById("searchInput");
    const clearBtn = document.getElementById("clearSearchBtn");

    searchInput.addEventListener("input", (e) => {
      state.searchQuery = e.target.value.trim();
      clearBtn.style.display = state.searchQuery ? "block" : "none";
      renderApp();
    });

    clearBtn.addEventListener("click", () => {
      searchInput.value = "";
      state.searchQuery = "";
      clearBtn.style.display = "none";
      renderApp();
    });

    const mapBox = document.getElementById("mapBox");
    const toggleMapBtn = document.getElementById("toggleMapBtn");
    toggleMapBtn.addEventListener("click", () => {
      if (mapBox.style.display === "none") {
        mapBox.style.display = "block";
        toggleMapBtn.innerText = "지도 접기 ▴";
      } else {
        mapBox.style.display = "none";
        toggleMapBtn.innerText = "지도 열기 ▾";
      }
    });

    renderApp();
  </script>
</body>
</html>
